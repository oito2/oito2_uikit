name: Release

# Runs on a vX.Y.Z tag pushed after `pnpm release:version`:
#   1. checks that every version in the repository equals the tag;
#   2. publishes the @oito2/* npm packages that are not on npm yet, with provenance;
#   3. builds the showcase installers on Linux, Windows and macOS;
#   4. creates a draft GitHub Release with the installers, SHA256SUMS and the changelog.
# The Rust crates need no publishing: apps depend on them through git and the tag.
#
# npm authentication: trusted publishing (OIDC) through the protected `release`
# environment. Only for the very first publication of a package, while it does not
# exist on npm yet, the environment holds a short-lived NPM_TOKEN secret.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One release at a time; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tools/release/sync-versions.ts --check "$GITHUB_REF_NAME"

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm pack turns the workspace: and catalog: ranges into real versions; npm then
      # publishes the tarball, through OIDC or, when it is set, NODE_AUTH_TOKEN.
      - name: Publish the packages missing from npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          out="$RUNNER_TEMP/npm"
          mkdir -p "$out"
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            private=$(node -p "require('./${dir}package.json').private === true")
            if [ "$private" = "true" ]; then continue; fi
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            cp LICENSE "$dir"
            (cd "$dir" && pnpm pack --pack-destination "$out")
            tarball="$out/$(echo "${name#@}" | tr '/' '-')-$version.tgz"
            npm publish "$tarball" --access public --provenance
          done

  binaries:
    name: Showcase (${{ matrix.name }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 is the oldest supported system: its glibc keeps the
          # Linux packages installable on every distribution of the baseline.
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev xdg-utils
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - name: Add the macOS targets of the universal binary
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tauri build ${{ matrix.args }}
      - name: Collect the installers
        shell: bash
        run: |
          base="oito2-uikit-showcase-${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # Copies the single file matching a pattern to dist/ under a new name.
          pick() {
            set -- $1 "$2"
            if [ "$#" -ne 2 ] || [ ! -f "$1" ]; then
              echo "expected exactly one file for the pattern" >&2
              exit 1
            fi
            cp "$1" "dist/$2"
          }
          case "${{ matrix.name }}" in
            linux)
              pick "target/release/bundle/deb/*.deb" "$base-linux-amd64.deb"
              pick "target/release/bundle/rpm/*.rpm" "$base-linux-x86_64.rpm"
              pick "target/release/bundle/appimage/*.AppImage" "$base-linux-amd64.AppImage"
              ;;
            windows)
              pick "target/release/bundle/msi/*.msi" "$base-windows-x64.msi"
              pick "target/release/bundle/nsis/*-setup.exe" "$base-windows-x64-setup.exe"
              ;;
            macos)
              pick "target/universal-apple-darwin/release/bundle/dmg/*.dmg" "$base-macos-universal.dmg"
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: [npm, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: showcase-*
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      # The notes are the version's section of the @oito2/ui changelog; every
      # package shares the version, and @oito2/ui receives every changeset's entry.
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "npm packages: \`pnpm add @oito2/ui@$version\` (and the other @oito2/* packages you use)."
            echo
            echo "Rust plugins: \`git = \"https://github.com/${GITHUB_REPOSITORY}\", tag = \"$GITHUB_REF_NAME\"\`."
            echo
            echo "The showcase installers are not code-signed. Verify a download with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            awk -v v="$version" '
              $0 == "## " v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' packages/ui/CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
