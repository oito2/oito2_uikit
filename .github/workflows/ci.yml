name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs of different events don't cancel each other, and only pull request
# runs give way to a newer push to the same branch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Lint, check, test and build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated CSS is up to date
        run: pnpm generate:check
      - name: API reference is up to date
        run: pnpm docs:check
      - run: pnpm test:tools
      - run: pnpm build
      - run: pnpm check
      - name: Install Playwright browsers
        run: pnpm --filter @oito2/ui exec playwright install --with-deps chromium webkit
      - run: pnpm test
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: |
            packages/*/.vitest/attachments/**
            apps/showcase/test-results/**
          if-no-files-found: ignore

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Every platform reports its result, even when another one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The showcase crate embeds the static frontend build at compile time.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  msrv:
    name: Rust MSRV (plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every rustup proxy, the cache action's probe included, uses the MSRV of
    # Cargo.toml instead of the toolchain pinned in rust-toolchain.toml.
    env:
      RUSTUP_TOOLCHAIN: '1.90'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev
      - run: rustup toolchain install 1.90 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
      # Only the plugins: the showcase crate embeds the frontend build, which
      # the MSRV says nothing about.
      - run: cargo +1.90 check -p tauri-plugin-oito2-window -p tauri-plugin-oito2-settings --locked

  smoke:
    name: Desktop smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev webkitgtk-webdriver xvfb
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the packages: the Tauri CLI builds the showcase itself (beforeBuildCommand).
      - run: pnpm -r --filter './packages/*' build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: smoke
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      # A debug build through the CLI embeds the frontend; a plain `cargo build` would
      # point the window at the dev server instead.
      - name: Build the showcase (debug, no bundle)
        run: pnpm tauri build --debug --no-bundle
      - name: Smoke test
        working-directory: apps/showcase
        run: xvfb-run --auto-servernum node smoke/webdriver.ts ../../target/debug/oito2-uikit-showcase
