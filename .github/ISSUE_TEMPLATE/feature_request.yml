name: Feature request
description: Suggest a new component, option or integration
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Visual and design changes start in [oito2_ui](https://github.com/oito2/oito2_ui), the design source of truth; behavior and API ideas for this repository are welcome here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The API, component or behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Components
        - Themes and tokens
        - Window chrome
        - System settings
        - Files
        - Syntax highlighting
        - Showcase
        - Other
