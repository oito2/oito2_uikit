name: oito2_uikit_parity
description: Exports the oito2_ui design data (tokens, schemes, strings) as JSON fixtures for the oito2_uikit parity tests.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # The oito2_ui checkout linked (locally) or cloned (CI) into .references/.
  oito2_ui:
    path: ../../.references/oito2_ui/packages/oito2_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

# Outside its own workspace, oito2_ui would resolve newer versions than the ones
# it is tested with. These follow the versions locked in oito2_ui/pubspec.lock.
dependency_overrides:
  flutter_lucide: 1.59.0
  intl: 0.20.3
  material_ui: 1.7.0
