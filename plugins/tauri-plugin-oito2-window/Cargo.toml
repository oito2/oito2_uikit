[package]
name = "tauri-plugin-oito2-window"
description = "Window chrome integration for @oito2/ui: client-side decorations and window controls on Linux, Windows and macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
links = "tauri-plugin-oito2-window"

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = { workspace = true }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

# The workspace forbids unsafe code; this crate only denies it, so the native window menu
# module can allow it (see src/menu.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
